<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trono Admin</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  body { overflow: auto; }
  [hidden] { display: none !important; }
  .adm { max-width: 980px; margin: 0 auto; padding: 28px 16px 80px; }
  .adm-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .adm-topo .marca { padding: 0; }
  .adm h1 { margin: 22px 0 4px; font-size: 30px; font-weight: 800; }
  .sub { color: var(--texto-2); margin: 0 0 22px; }
  .campo, select, .entrar input {
    height: 42px; border-radius: 10px; border: 1px solid var(--linha); background: var(--painel);
    color: var(--texto); font: inherit; padding: 0 12px; min-width: 0;
  }
  .campo:focus, select:focus, .entrar input:focus { outline: none; border-color: var(--ouro); }
  .entrar { display: flex; gap: 10px; flex-wrap: wrap; max-width: 520px; }
  .entrar input { flex: 1; min-width: 200px; }
  .msg { margin-top: 12px; color: var(--ouro); min-height: 22px; font-weight: 500; }
  .msg.erro { color: #ff8a7a; }

  .abas-adm { display: flex; gap: 6px; border-bottom: 1px solid var(--linha); margin: 6px 0 18px; }
  .abas-adm button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px; color: var(--texto-2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas-adm button.on { color: var(--texto); border-color: var(--ouro); }

  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .resumo div { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 16px; }
  .resumo strong { font-size: 24px; display: block; }
  .resumo span { color: var(--texto-2); font-size: 13px; }

  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtros .campo { flex: 1; min-width: 200px; }
  .linha {
    display: grid; grid-template-columns: 44px minmax(0, 1fr) 190px 52px; gap: 12px; align-items: center;
    padding: 10px 6px; border-bottom: 1px solid var(--linha);
  }
  .linha.off { opacity: .5; }
  .linha .capa { width: 44px; height: 44px; border-radius: 6px; }
  .linha .nome strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .linha .nome small { color: var(--texto-2); font-size: 13px; display: block; }
  .linha .nome .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--ouro); border: 1px solid #5a4a20; border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; }
  .linha .mini { display: inline-flex; gap: 2px; margin-top: 2px; }
  .linha .mini button { font-size: 12px; color: var(--texto-2); padding: 2px 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
  .linha .mini button:hover { color: var(--texto); background: var(--painel-2); }
  .linha .mini svg.lucide { width: 13px; height: 13px; }
  .linha select { width: 100%; height: 36px; font-size: 14px; }

  .chave { position: relative; width: 46px; height: 26px; border-radius: 999px; background: #3a342b; transition: background .15s; }
  .chave::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #cfc6b6; transition: transform .15s; }
  .chave.on { background: var(--ouro); }
  .chave.on::after { transform: translateX(20px); background: #1a1205; }

  .soltar {
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; cursor: pointer;
    border: 2px dashed #5a5246; border-radius: 14px; padding: 34px 16px; color: var(--texto-2);
  }
  .soltar.sobre, .soltar:hover { border-color: var(--ouro); color: var(--texto); }
  .soltar svg.lucide { width: 36px; height: 36px; color: var(--ouro); }
  .soltar strong { color: var(--texto); font-size: 17px; }
  .envio { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr) 170px 36px; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .envio .capa-sel { width: 56px; height: 56px; border-radius: 8px; background: var(--painel-2) center/cover; display: grid; place-items: center; color: var(--texto-2); cursor: pointer; border: 1px dashed #5a5246; }
  .envio .capa-sel.tem { border: 0; }
  .envio .capa-sel.tem svg { display: none; }
  .envio small { grid-column: 2 / -1; color: var(--texto-2); font-size: 12px; margin-top: -4px; }
  .envio.feito { opacity: .55; }
  .envio .estado { font-weight: 600; }
  .envio .estado.ok { color: #7fd38a; } .envio .estado.erro { color: #ff8a7a; }
  .rodape-envio { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .rodape-envio p { color: var(--texto-2); font-size: 13px; margin: 0; max-width: 56ch; }
  .vazio-lista { color: var(--texto-2); padding: 30px 0; text-align: center; }

  @media (max-width: 720px) {
    .linha { grid-template-columns: 44px minmax(0, 1fr) 52px; }
    .linha select { grid-column: 2 / 3; grid-row: 2; }
    .envio { grid-template-columns: 56px minmax(0, 1fr) 36px; }
    .envio .t, .envio .a, .envio select { grid-column: 2 / 3; }
    .envio .capa-sel { grid-row: span 3; align-self: start; }
    .envio .rem { grid-column: 3; grid-row: 1; }
    .envio small { grid-column: 1 / -1; margin-top: 0; }
  }
</style>
</head>
<body>
<div class="adm">
  <div class="adm-topo">
    <a class="marca" href="./"><span class="marca-ico"><i data-lucide="crown"></i></span>Trono</a>
    <a class="btn btn-borda" href="./"><i data-lucide="play"></i>Abrir o app</a>
  </div>
  <h1>Administração</h1>
  <p class="sub">Escolha o que fica no ar, ajuste gêneros e envie músicas novas sem precisar mexer no código.</p>

  <form class="entrar" id="entrar">
    <input type="password" id="senha" placeholder="Senha do admin" autocomplete="current-password" required>
    <button class="btn btn-ouro" type="submit"><i data-lucide="log-in"></i>Entrar</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div id="painel" hidden>
    <nav class="abas-adm">
      <button class="on" data-aba="musicas"><i data-lucide="list-music"></i>Músicas</button>
      <button data-aba="enviar"><i data-lucide="upload"></i>Enviar músicas</button>
    </nav>

    <section id="aba-musicas">
      <div class="resumo" id="resumo"></div>
      <div class="filtros">
        <input class="campo" id="filtroTexto" type="search" placeholder="Buscar música, artista ou gênero">
        <select id="filtroTipo">
          <option value="todas">Todas</option>
          <option value="ativas">Só ativas</option>
          <option value="inativas">Só desativadas</option>
          <option value="enviadas">Enviadas pelo admin</option>
          <option value="sem">Sem gênero</option>
        </select>
        <button class="btn btn-borda" id="ligarFiltro"><i data-lucide="eye"></i>Ativar as filtradas</button>
        <button class="btn btn-borda" id="desligarFiltro"><i data-lucide="eye-off"></i>Desativar as filtradas</button>
      </div>
      <div id="lista"></div>
    </section>

    <section id="aba-enviar" hidden>
      <label class="soltar" id="soltar">
        <i data-lucide="upload-cloud"></i>
        <strong>Arraste as músicas aqui ou clique para escolher</strong>
        <span>MP3, M4A, WAV ou OGG, até 30 MB cada. Vão para a pasta "Trono - Musicas" do seu Google Drive.</span>
        <input type="file" id="arquivos" accept="audio/*" multiple hidden>
      </label>
      <div id="fila"></div>
      <div class="rodape-envio" id="rodapeEnvio" hidden>
        <p>Sem gênero escolhido, a música entra em "Sem gênero" e os ouvintes votam. A capa é opcional: clique no quadrado para escolher uma imagem.</p>
        <button class="btn btn-ouro" id="enviarTudo"><i data-lucide="send"></i>Enviar</button>
      </div>
    </section>
  </div>
</div>
<input type="file" id="capaArquivo" accept="image/*" hidden>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="config.js"></script>
<script>
const API = window.TRONO_API, $ = s => document.querySelector(s);
const SEM = 'Sem gênero', LIMITE = 30 * 1024 * 1024;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tempo = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const icones = () => window.lucide && lucide.createIcons();
let senha = '', base = [], est = null, fila = [];
icones();

function msg(t, erro) { const m = $('#msg'); m.textContent = t || ''; m.classList.toggle('erro', !!erro); }
if (!API) msg('O servidor ainda não foi ligado (config.js sem TRONO_API).', true);
try { const s = sessionStorage.getItem('trono.adm'); if (s) $('#senha').value = s; } catch {}

async function post(corpo) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ senha, ...corpo }) });
  const d = await r.json();
  if (!d.ok) throw new Error(d.erro || 'Não deu certo.');
  return d;
}
async function acao(corpo, ok) {
  msg('Salvando...');
  try { est = await post(corpo); msg(ok || 'Salvo.'); desenhar(); return true; }
  catch (e) { msg(e.message === 'Failed to fetch' ? 'Sem conexão com o servidor.' : e.message, true); return false; }
}

$('#entrar').addEventListener('submit', async e => {
  e.preventDefault();
  if (!API) return;
  senha = $('#senha').value.trim(); msg('Conferindo...');
  try {
    [est, base] = await Promise.all([post({ acao: 'entrar' }), fetch('dados/musicas.json').then(r => r.json())]);
    try { sessionStorage.setItem('trono.adm', senha); } catch {}
    $('#entrar').hidden = true; msg(''); $('#painel').hidden = false; desenhar();
  } catch (err) {
    msg(/Failed to fetch|JSON/.test(err.message) ? 'O servidor não respondeu. Se você acabou de atualizar, rode configurar() no editor do Apps Script de novo.' : err.message, true);
  }
});

document.querySelectorAll('[data-aba]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-aba]').forEach(x => x.classList.toggle('on', x === b));
  $('#aba-musicas').hidden = b.dataset.aba !== 'musicas';
  $('#aba-enviar').hidden = b.dataset.aba !== 'enviar';
}));

// ---------- Lista de musicas ----------
function todas() {
  const fora = new Set(est.inativas);
  return [...base, ...est.enviadas].map(m => {
    const v = Object.entries(est.votos[m.id] || {}).sort((a, b) => b[1] - a[1]);
    return { ...m, ativa: !fora.has(m.id), fixo: est.fixos[m.id] || '', votosTxt: v.map(([g, n]) => `${g} ${n}`).join(', ') };
  });
}
function filtradas() {
  const n = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const q = n($('#filtroTexto').value.trim()), tipo = $('#filtroTipo').value;
  return todas().filter(m => {
    if (tipo === 'ativas' && !m.ativa) return false;
    if (tipo === 'inativas' && m.ativa) return false;
    if (tipo === 'enviadas' && !m.enviada) return false;
    if (tipo === 'sem' && (m.genero !== SEM || m.fixo)) return false;
    return !q || n(`${m.titulo} ${m.artista} ${m.fixo || m.genero}`).includes(q);
  });
}
function desenhar() {
  const t = todas();
  $('#resumo').innerHTML = `
    <div><strong>${t.filter(m => m.ativa).length}</strong><span>no ar</span></div>
    <div><strong>${t.filter(m => !m.ativa).length}</strong><span>desativadas</span></div>
    <div><strong>${est.enviadas.length}</strong><span>enviadas pelo admin</span></div>
    <div><strong>${Object.values(est.votos).reduce((s, v) => s + Object.values(v).reduce((a, b) => a + b, 0), 0)}</strong><span>votos de gênero</span></div>`;
  const lista = filtradas();
  if (!lista.length) { $('#lista').innerHTML = '<div class="vazio-lista">Nenhuma música com esse filtro.</div>'; return; }
  $('#lista').innerHTML = lista.map(m => {
    const capa = m.capa ? `<span class="capa com-img" style="--img:url('${esc(m.capa)}')"></span>` : `<span class="capa" style="--cor:#2c261c"><i data-lucide="music"></i></span>`;
    const ops = `<option value="">${m.genero === SEM ? 'Sem gênero (ouvintes votam)' : 'Padrão: ' + esc(m.genero)}</option>` +
      est.generos.map(g => `<option ${g === m.fixo ? 'selected' : ''}>${esc(g)}</option>`).join('');
    return `<div class="linha ${m.ativa ? '' : 'off'}" data-id="${esc(m.id)}">
      ${capa}
      <div class="nome"><strong>${esc(m.titulo)}${m.enviada ? '<span class="tag">enviada</span>' : ''}</strong>
        <small>${esc(m.artista)} · ${tempo(m.dur)}${m.votosTxt ? ' · votos: ' + esc(m.votosTxt) : ''}</small>
        <span class="mini">
          <button data-ouvir="${esc(m.id)}"><i data-lucide="headphones"></i>Ouvir</button>
          ${m.enviada ? `<button data-renomear="${esc(m.id)}"><i data-lucide="pencil"></i>Renomear</button>
          <button data-apagar="${esc(m.id)}"><i data-lucide="trash-2"></i>Apagar</button>` : ''}
        </span></div>
      <select data-genero="${esc(m.id)}" aria-label="Gênero de ${esc(m.titulo)}">${ops}</select>
      <button class="chave ${m.ativa ? 'on' : ''}" data-ativar="${esc(m.id)}" role="switch" aria-checked="${m.ativa}" aria-label="${m.ativa ? 'Desativar' : 'Ativar'} ${esc(m.titulo)}"></button>
    </div>`;
  }).join('');
  icones();
}
$('#filtroTexto').addEventListener('input', desenhar);
$('#filtroTipo').addEventListener('change', desenhar);
$('#ligarFiltro').addEventListener('click', () => emMassa(true));
$('#desligarFiltro').addEventListener('click', () => emMassa(false));
function emMassa(ativa) {
  const ids = filtradas().filter(m => m.ativa !== ativa).map(m => m.id);
  if (!ids.length) return msg(ativa ? 'Todas as filtradas já estão no ar.' : 'Todas as filtradas já estão desativadas.');
  if (!confirm(`${ativa ? 'Ativar' : 'Desativar'} ${ids.length} música${ids.length > 1 ? 's' : ''}?`)) return;
  acao({ acao: 'ativar', ids, ativa }, `${ids.length} música${ids.length > 1 ? 's' : ''} ${ativa ? 'no ar' : 'fora do ar'}.`);
}
const player = new Audio();
$('#lista').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const m = todas().find(x => x.id === (b.dataset.ativar || b.dataset.ouvir || b.dataset.renomear || b.dataset.apagar));
  if (!m) return;
  if (b.dataset.ativar) acao({ acao: 'ativar', id: m.id, ativa: !m.ativa }, m.ativa ? `${m.titulo} saiu do ar.` : `${m.titulo} voltou ao ar.`);
  if (b.dataset.ouvir) {
    if (player.dataset.id === m.id && !player.paused) { player.pause(); return msg(''); }
    player.src = m.audio; player.dataset.id = m.id; player.play().then(() => msg('Tocando ' + m.titulo + '. Clique em Ouvir de novo para parar.')).catch(() => msg('Não consegui tocar essa música.', true));
  }
  if (b.dataset.renomear) {
    const titulo = prompt('Nome da música', m.titulo); if (titulo === null) return;
    const artista = prompt('Artista', m.artista); if (artista === null) return;
    acao({ acao: 'editar', id: m.id, titulo, artista });
  }
  if (b.dataset.apagar && confirm(`Apagar "${m.titulo}"? O arquivo vai para a lixeira do seu Google Drive.`)) acao({ acao: 'apagar', id: m.id }, 'Música apagada.');
});
$('#lista').addEventListener('change', e => {
  const s = e.target.closest('select[data-genero]'); if (!s) return;
  acao({ acao: 'fixar', id: s.dataset.genero, genero: s.value }, s.value ? 'Gênero travado em ' + s.value + '.' : 'Gênero voltou ao padrão.');
});

// ---------- Envio ----------
const soltar = $('#soltar');
$('#arquivos').addEventListener('change', e => { adicionar(e.target.files); e.target.value = ''; });
['dragover', 'dragenter'].forEach(t => soltar.addEventListener(t, e => { e.preventDefault(); soltar.classList.add('sobre'); }));
['dragleave', 'drop'].forEach(t => soltar.addEventListener(t, () => soltar.classList.remove('sobre')));
soltar.addEventListener('drop', e => { e.preventDefault(); adicionar(e.dataTransfer.files); });

function nomeBonito(arq) {
  let t = arq.replace(/\.[a-z0-9]+$/i, '').replace(/[_]+/g, ' ').replace(/\s*\(\d+\)$/, '').replace(/\s+/g, ' ').trim();
  if (t === t.toUpperCase() && t.length > 3) t = t.charAt(0) + t.slice(1).toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function duracao(file) {
  return new Promise(res => {
    const a = new Audio(), url = URL.createObjectURL(file);
    a.preload = 'metadata';
    a.onloadedmetadata = () => { URL.revokeObjectURL(url); res(isFinite(a.duration) ? a.duration : 0); };
    a.onerror = () => { URL.revokeObjectURL(url); res(-1); };
    a.src = url;
  });
}
async function adicionar(files) {
  for (const f of files) {
    const item = { f, titulo: nomeBonito(f.name), artista: 'King', genero: '', capa: null, estado: '', dur: 0 };
    if (!/^audio\//.test(f.type)) item.estado = 'erro:Não é um arquivo de áudio.';
    else if (f.size > LIMITE) item.estado = 'erro:Maior que 30 MB.';
    else {
      item.dur = await duracao(f);
      if (item.dur < 0) item.estado = 'erro:O navegador não conseguiu ler esse áudio.';
    }
    fila.push(item);
  }
  desenharFila();
}
const livre = i => !i.estado || i.estado.startsWith('falhou');
function desenharFila() {
  $('#rodapeEnvio').hidden = !fila.some(livre);
  const ops = g => `<option value="">Sem gênero (ouvintes votam)</option>` + (est ? est.generos : []).map(x => `<option ${x === g ? 'selected' : ''}>${esc(x)}</option>`).join('');
  $('#fila').innerHTML = fila.map((i, n) => {
    const [tipo, texto] = i.estado.split(/:(.*)/);
    const info = tipo === 'erro' || tipo === 'falhou' ? `<span class="estado erro">${esc(texto)}${tipo === 'falhou' ? ' Clique em Enviar para tentar de novo.' : ''}</span>` : tipo === 'ok' ? '<span class="estado ok">Enviada e no ar.</span>'
      : tipo === 'enviando' ? '<span class="estado">Enviando...</span>' : `${esc(i.f.name)} · ${(i.f.size / 1048576).toFixed(1)} MB · ${tempo(i.dur)}`;
    const trava = livre(i) ? '' : 'disabled';
    return `<div class="envio ${tipo === 'ok' ? 'feito' : ''}" data-n="${n}">
      <span class="capa-sel ${i.capa ? 'tem' : ''}" data-capa="${n}" title="Escolher capa" style="${i.capa ? `background-image:url(data:image/jpeg;base64,${i.capa})` : ''}"><i data-lucide="image-plus"></i></span>
      <input class="campo t" data-campo="titulo" value="${esc(i.titulo)}" placeholder="Nome da música" maxlength="80" ${trava}>
      <input class="campo a" data-campo="artista" value="${esc(i.artista)}" placeholder="Artista" maxlength="60" ${trava}>
      <select data-campo="genero" ${trava}>${ops(i.genero)}</select>
      <button class="ico rem" data-tirar="${n}" aria-label="Tirar da lista"><i data-lucide="x"></i></button>
      <small>${info}</small>
    </div>`;
  }).join('');
  icones();
}
$('#fila').addEventListener('input', e => {
  const c = e.target.dataset.campo; if (!c) return;
  fila[+e.target.closest('.envio').dataset.n][c] = e.target.value;
});
$('#fila').addEventListener('change', e => {
  const c = e.target.dataset.campo; if (!c) return;
  fila[+e.target.closest('.envio').dataset.n][c] = e.target.value;
});
let capaAlvo = -1;
$('#fila').addEventListener('click', e => {
  const t = e.target.closest('[data-tirar]');
  if (t) { fila.splice(+t.dataset.tirar, 1); return desenharFila(); }
  const c = e.target.closest('[data-capa]');
  if (c && livre(fila[+c.dataset.capa])) { capaAlvo = +c.dataset.capa; $('#capaArquivo').click(); }
});
$('#capaArquivo').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || capaAlvo < 0) return;
  try { fila[capaAlvo].capa = await reduzirCapa(f); desenharFila(); } catch { msg('Não consegui ler essa imagem.', true); }
});
function reduzirCapa(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 400;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 400, 400);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = rej; img.src = url;
  });
}
function base64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
$('#enviarTudo').addEventListener('click', async () => {
  const pendentes = fila.filter(livre);
  if (pendentes.some(i => !i.titulo.trim())) return msg('Dê um nome para todas as músicas antes de enviar.', true);
  $('#enviarTudo').disabled = true;
  let ok = 0;
  for (const i of pendentes) {
    i.estado = 'enviando'; desenharFila();
    try {
      const mime = i.f.type === 'audio/mp3' ? 'audio/mpeg' : i.f.type;
      est = await post({ acao: 'enviar', titulo: i.titulo, artista: i.artista, genero: i.genero, dur: i.dur, mime, dados: await base64(i.f), capa: i.capa });
      i.estado = 'ok'; ok++;
    } catch (e) { i.estado = 'falhou:' + (e.message === 'Failed to fetch' ? 'Sem conexão, tente de novo.' : e.message); }
    desenharFila();
  }
  $('#enviarTudo').disabled = false;
  msg(ok ? `${ok} música${ok > 1 ? 's' : ''} no ar. Quem abrir o app já vê.` : 'Nenhuma música foi enviada.', !ok);
  desenhar();
});
</script>
